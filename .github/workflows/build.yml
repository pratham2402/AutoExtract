name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: linux
          - os: macos-latest
            arch: arm64
            target: macos
          - os: windows-latest
            arch: x86_64
            target: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar p7zip-full

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install unrar p7zip

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install unrar 7zip -y

      - name: Install Python dependencies
        run: |
          pip install -e ".[full]"
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller `
            --noconfirm --clean --onefile `
            --name "autoextract-${{ matrix.target }}-${{ matrix.arch }}" `
            --hidden-import send2trash `
            --hidden-import py7zr `
            --hidden-import rarfile `
            --hidden-import requests `
            --hidden-import watchdog `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module setuptools `
            --exclude-module pip `
            autoextract/__main__.py
        shell: bash
        if: runner.os != 'Windows'

      - name: Build binary (Windows)
        run: |
          pyinstaller --noconfirm --clean --onefile --name "autoextract-${{ matrix.target }}-${{ matrix.arch }}" --hidden-import send2trash --hidden-import py7zr --hidden-import rarfile --hidden-import requests --hidden-import watchdog --exclude-module tkinter --exclude-module matplotlib --exclude-module numpy --exclude-module setuptools --exclude-module pip autoextract/__main__.py
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoextract-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
